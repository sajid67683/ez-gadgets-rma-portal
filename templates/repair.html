<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMA Dashboard | We Repair BD</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script>
        document.documentElement.setAttribute('data-theme', localStorage.getItem('ez_theme') || 'light');
        function toggleTheme() {
            const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('ez_theme', next);
        }
    </script>
</head>

<body>

    <header>
        <div class="header-left-spacer"></div>

        <div class="logo-area">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="We Repair BD Logo">
            <div class="logo-text">
                <h1>WE REPAIR BD</h1>
                <p>RMA Dashboard</p>
            </div>
        </div>

        <div class="header-controls">
            <a href="/repair-logout" class="icon-btn" title="Logout">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </a>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeIcon"></button>
        </div>
        
    </header>

    <main>
        <div class="panel admin-panel active">
            <div class="section-header">
                <h2>Assigned Devices</h2>
                <p>Update repair status and add technician notes</p>
            </div>
            <div id="repairRecordsList">
                <div class="empty-state"><span class="spinner"></span>
                    <p>Fetching assigned devices...</p>
                </div>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="techModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Update Device Status</h3>
                <div class="close-btn" onclick="closeModal()">✕</div>
            </div>
            <div id="modalContent"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <div class="modal-overlay" id="customerModal" style="display: none;">
        <div class="modal" style="max-width: 350px;">
            <div class="modal-header">
                <h3>Customer Details</h3>
                <div class="close-btn" onclick="document.getElementById('customerModal').style.display='none'">✕</div>
            </div>
            <div id="customerModalContent">
            </div>
            <div style="text-align: center; margin-top: 15px;">
                <p style="font-size: 12px; color: var(--text3);">Click any block to copy</p>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/repair.js') }}"></script>
</body>

</html>
