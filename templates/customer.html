<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZ Gadgets | Warranty Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script>
        const savedTheme = localStorage.getItem('ez_theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('ez_theme', next);
            document.getElementById('themeIcon').innerText = next === 'dark' ? '☀️' : '🌙';
        }
    </script>
</head>

<body>
    <header>
        <div class="header-left-spacer"></div>
        <div class="logo-area">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Ez Gadgets Logo">
            <div class="logo-text">
                <h1>EZ GADGETS</h1>
                <p>Official Warranty Portal</p>
            </div>
        </div>
        <div class="header-controls">
            <button class="theme-toggle" onclick="toggleTheme()" id="themeIcon"></button>
        </div>
    </header>
    <script>document.getElementById('themeIcon').innerText = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';</script>
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('new', this)">Submit Claim</button>
        <button class="tab-btn" onclick="switchTab('track', this)">Track Status</button>
    </div>
    <main>
        <div class="panel active" id="panel-new">
            <div class="section-header">
                <h2>Start a Warranty Claim</h2>
                <p>Fill out your details to generate an RMA drop-off code</p>
            </div>
            <div class="form-grid">
                <div class="form-group full">
                    <label>Drop-off Branch</label>
                    <select id="rmaLocation">                       
                        <option value="Multiplan Branch">📍 Multiplan Branch</option>
                        <option value="CTG Branch">📍 CTG Branch</option>
                    </select>
                </div>
                <div class="form-group"><label>Customer Name</label><input type="text" id="customerName"
                        placeholder="Full name"></div>
                <div class="form-group"><label>Contact / Phone</label><input type="text" id="contact"
                        placeholder="+880…"></div>
                <div class="form-group full"><label>Address</label><input type="text" id="address"
                        placeholder="Street, area, city"></div>
                <div class="divider" style="grid-column:1/-1;margin:4px 0;"></div>
                <div class="form-group"><label>Product Name</label><input type="text" id="productName"
                        placeholder="e.g. Aula F75"></div>
                <div class="form-group"><label>Serial Number</label><input type="text" id="serialNumber"
                        placeholder="S/N must match with the product"></div>
                <div class="form-group full"><label>Issue Description</label><textarea id="issue"
                        placeholder="Describe the problem in detail…"></textarea></div>
            </div>
            <div class="code-display" id="codeDisplay">
                <div class="label">Your RMA Tracking Code</div>
                <div class="code" id="generatedCode">—</div>
                <p style="font-size: 12px; color: var(--text3); margin-top: 8px;">Please write this code down and bring
                    it with your device to the store.</p>
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="submitRMA()" id="submitBtn">Submit Claim</button>
            </div>
        </div>
        <div class="panel" id="panel-track">
            <div class="section-header">
                <h2>Track Your Device</h2>
                <p>Enter your RMA code to check the repair status</p>
            </div>
            <div class="form-group full">
                <input type="text" id="trackQuery" placeholder="e.g. EZ-BDA-240415-ABCD"
                    onkeyup="if(event.key==='Enter') trackRMA()"
                    style="text-align: center; font-size: 16px; letter-spacing: 1px; padding: 16px;">
            </div>
            <div class="btn-group"><button class="btn btn-primary" onclick="trackRMA()" id="trackBtn">Check
                    Status</button></div>
            <div id="trackResults" style="margin-top: 32px;"></div>
        </div>
    </main>
    <div class="toast" id="toast"></div>
    <script src="{{ url_for('static', filename='js/customer.js') }}"></script>
</body>

</html>
