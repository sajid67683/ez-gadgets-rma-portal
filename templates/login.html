<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ez Gadgets | Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script>
        const savedTheme = localStorage.getItem('ez_theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>

<body style="display: flex; align-items: center; justify-content: center; height: 100vh;">

    <div class="panel active" style="text-align: center; max-width: 400px; margin: 20px;">
        <h2 style="font-size: 24px; font-weight: 700; color: var(--accent); margin-bottom: 8px;">EZ GADGETS</h2>
        <p style="color: var(--text3); font-size: 14px; margin-bottom: 32px;">Authorized Personnel Only</p>

        {% if error %}
        <div
            style="color: var(--accent3); font-size: 13px; font-weight: 600; margin-bottom: 20px; background: rgba(225, 29, 72, 0.1); padding: 10px; border-radius: var(--radius);">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <input type="password" name="password" placeholder="••••••••" required autofocus
                style="text-align: center; font-size: 20px; letter-spacing: 4px; margin-bottom: 24px; padding: 16px;">
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px;">Secure Login</button>
        </form>
    </div>

</body>

</html>
